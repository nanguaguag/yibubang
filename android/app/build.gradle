plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.melonhu.yibubang"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.melonhu.yibubang"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    def keystorePropertiesFile = rootProject.file("key.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    def hasKeystoreProperties = keystorePropertiesFile.exists() && keystoreProperties['storeFile']

    def envStorePath = System.getenv("KEYSTORE_PATH")
    def envStorePassword = System.getenv("KEYSTORE_PASSWORD")
    def envKeyAlias = System.getenv("KEY_ALIAS")
    def envKeyPassword = System.getenv("KEY_PASSWORD")
    def hasEnvKeystore = envStorePath && envStorePassword && envKeyAlias && envKeyPassword
    def hasReleaseSigning = hasKeystoreProperties || hasEnvKeystore

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                if (hasKeystoreProperties) {
                    def propFile = file(keystoreProperties['storeFile'])
                    storeFile propFile.isAbsolute() ? propFile : rootProject.file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                } else {
                    def candidate = file(envStorePath)
                    if (!candidate.exists()) {
                        candidate = rootProject.file(envStorePath)
                    }
                    if (!candidate.exists()) {
                        candidate = new File(projectDir, envStorePath)
                    }
                    storeFile candidate
                    storePassword envStorePassword
                    keyAlias envKeyAlias
                    keyPassword envKeyPassword
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
